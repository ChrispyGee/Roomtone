name: Microsoft Store package

# Builds the Store package (.msix) to check it is well formed. It does not publish anything: a
# Store submission is made by hand in Partner Center (docs/MICROSOFT_STORE.md). Runs by hand, and
# when the packaging files change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/windows/msix/**"
      - ".github/workflows/msix.yml"

permissions:
  contents: read

jobs:
  msix:
    name: Build the .msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          pwsh packaging/windows/msix/build-msix.ps1 -Version $version -OutFile "dist/roomtone-v$version.msix"
      - uses: actions/upload-artifact@v7
        with:
          name: msix-check
          path: dist/*.msix
          if-no-files-found: error
