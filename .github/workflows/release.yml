name: Release

# Pushing a tag like v0.5.1 builds Roomtone on each platform (a zip/tar.gz plus an installer:
# .dmg, Windows setup .exe, Linux .deb and .rpm) and attaches them to a GitHub release, with that
# version's section of CHANGELOG.md as notes.
# "Run workflow" on a branch builds the same files and keeps them as workflow artifacts,
# without publishing a release (a way to try the installers).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, exe: roomtone, archive: tar.gz }
          - { name: windows-x64, os: windows-latest, exe: roomtone.exe, archive: zip }
          - { name: linux-x64, os: ubuntu-latest, exe: roomtone, archive: tar.gz }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux desktop packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Build
        run: cargo build --release --locked

      - name: Version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          name="roomtone-v${VERSION}-${{ matrix.name }}"
          mkdir "$name"
          cp "target/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          mkdir -p dist
          mv "$name.${{ matrix.archive }}" dist/

      - name: Installer (macOS .dmg)
        if: runner.os == 'macOS'
        run: packaging/macos/build-dmg.sh "$VERSION" "dist/roomtone-v${VERSION}-macos-arm64.dmg"

      - name: Installer (Windows setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          target/release/roomtone.exe --write-icon dist/roomtone.ico
          ROOMTONE_VERSION="$VERSION" ROOMTONE_SRC="$(pwd -W)" iscc packaging/windows/roomtone.iss
          rm dist/roomtone.ico

      - name: Installers (Linux .deb and .rpm)
        if: runner.os == 'Linux'
        run: |
          target/release/roomtone --write-icon dist/roomtone.png 512
          cargo install cargo-deb --version 3.8.0 --locked
          cargo install cargo-generate-rpm --version 0.21.1 --locked
          cargo deb --no-build --output "dist/roomtone-v${VERSION}-linux-x64.deb"
          cargo generate-rpm --output "dist/roomtone-v${VERSION}-linux-x64.rpm"
          rm dist/roomtone.png

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version" >&2; exit 1; fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Roomtone ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
