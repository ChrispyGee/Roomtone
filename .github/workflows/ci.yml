name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Linux desktop packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Build
        run: cargo build --locked

      - name: Test (includes the translation check)
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Docs
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Package-manager files can be filled in
        if: runner.os == 'Linux'
        run: |
          v=9.9.9
          for n in macos-arm64.dmg windows-x64-setup.exe linux-x64.tar.gz; do
            printf '%064d  roomtone-v%s-%s\n' 0 "$v" "$n"
          done > sums
          packaging/package-managers/render.sh "$v" sums out
          grep -q 'version "9.9.9"' out/homebrew/roomtone.rb
          grep -q 'PackageVersion: 9.9.9' out/winget/ChrispyGee.Roomtone.yaml
          grep -q 'pkgver=9.9.9' out/aur/PKGBUILD
