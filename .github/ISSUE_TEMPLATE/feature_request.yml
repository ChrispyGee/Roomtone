name: Feature idea
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need first; we'll work out the design together.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I checked docs/ROADMAP.md and existing issues
          required: true
