[package]
name = "roomtone"
version = "0.5.1"
edition = "2021"
description = "A modern controller for S1 and S2 wireless speaker systems, with a headless mode and an MCP server for AI assistants"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ChrispyGee/Roomtone"
homepage = "https://github.com/ChrispyGee/Roomtone"
keywords = ["speakers", "upnp", "egui", "mcp", "music"]
categories = ["multimedia::audio", "gui"]
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "web_screen_reader", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
ureq = { version = "2", features = ["json", "native-certs"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
rfd = "0.18"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSData", "NSAttributedString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSImage", "NSMenu", "NSMenuItem", "NSColor", "NSFont", "NSFontDescriptor", "NSAttributedString", "NSParagraphStyle", "NSText", "NSWindow", "NSGraphics", "NSView", "NSBitmapImageRep", "NSImageRep"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Linux .deb package, built in CI with `cargo deb --no-build` (see docs/RELEASING.md).
[package.metadata.deb]
name = "roomtone"
maintainer = "Roomtone contributors"
section = "sound"
priority = "optional"
depends = "$auto"
extended-description = "Control S1 and S2 wireless speaker systems on your home network, with a headless mode and an MCP server for AI assistants."
assets = [
  ["target/release/roomtone", "usr/bin/", "755"],
  ["packaging/linux/roomtone.desktop", "usr/share/applications/", "644"],
  ["dist/roomtone.png", "usr/share/icons/hicolor/512x512/apps/roomtone.png", "644"],
  ["README.md", "usr/share/doc/roomtone/", "644"],
  ["LICENSE-MIT", "usr/share/doc/roomtone/", "644"],
  ["LICENSE-APACHE", "usr/share/doc/roomtone/", "644"],
]

# Linux .rpm package, built in CI with `cargo generate-rpm` (see docs/RELEASING.md).
[package.metadata.generate-rpm]
name = "roomtone"
summary = "Controller for S1 and S2 wireless speaker systems"
group = "Applications/Multimedia"
assets = [
  { source = "target/release/roomtone", dest = "/usr/bin/roomtone", mode = "755" },
  { source = "packaging/linux/roomtone.desktop", dest = "/usr/share/applications/roomtone.desktop", mode = "644" },
  { source = "dist/roomtone.png", dest = "/usr/share/icons/hicolor/512x512/apps/roomtone.png", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/roomtone/README.md", mode = "644", doc = true },
  { source = "LICENSE-MIT", dest = "/usr/share/doc/roomtone/LICENSE-MIT", mode = "644", doc = true },
  { source = "LICENSE-APACHE", dest = "/usr/share/doc/roomtone/LICENSE-APACHE", mode = "644", doc = true },
]
